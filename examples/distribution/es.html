<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>ESM配布デモ | Imicue</title><link rel="stylesheet" href="/demo.css"></head>
<body><header><strong>Imicue / ESM</strong><nav><a href="/iife/">IIFEデモ</a></nav></header><main>
<h1>生成したESMを試す</h1><p>架空製品DemoContractの操作を、ローカルのルールで判定します。判定用の通信はありません。</p>
<section class="panel"><h2>検索の操作例</h2><button id="action">検索例を開く</button><p id="result" role="status"></p></section>
<section class="panel"><h2>計測と判定</h2><p>許可して開始するまで計測しません。保存はメモリのみで、同意撤回や再読み込みで記録が消えます。</p>
<label><input id="consent" type="checkbox">このページの操作の計測を許可する</label>
<div class="controls"><button id="start" disabled>計測を開始</button><button id="stop">計測を停止</button><button id="revoke">同意を撤回</button></div>
<p id="status" role="status">計測停止中</p><h3>現在の集計</h3><pre id="snapshot"></pre><h3>判定の詳細</h3><pre id="decision">判定前</pre></section>
</main><script type="module" src="/es-entry.js"></script></body></html>
