name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 通常チェック
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TYPESAFE_API_KEY: ''
      RUN_JEV_INTEGRATION: ''
      RUN_JEV_EVALUATION: ''
      RUN_JEV_BROWSER: ''
      RUN_JEV_SERVER: ''
      RUN_CATALOG_EVALUATION: ''
      RUN_CATALOG_BROWSER: ''
      RUN_SAFARI_JEV: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 依存関係をインストール
        run: npm ci
      - name: Playwrightの3ブラウザをインストール
        run: npx playwright install --with-deps chromium firefox webkit
      - name: 型・静的解析・単体・ビルド・配布・ブラウザを検証
        run: npm run check
